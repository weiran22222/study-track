name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check the build environment
        run: sh ./scripts/check-environment.sh

      - name: Run the canonical verification command
        run: ./mvnw --batch-mode --no-transfer-progress verify
