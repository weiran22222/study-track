name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check pull request branch flow
        if: github.event_name == 'pull_request'
        run: >-
          sh ./scripts/check-branch-flow.sh
          "${{ github.event.pull_request.base.ref }}"
          "${{ github.event.pull_request.head.ref }}"

      - name: Check the complete pull request diff
        if: github.event_name == 'pull_request'
        run: >-
          sh ./scripts/check-pr-diff.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check the build environment
        run: sh ./scripts/check-environment.sh

      - name: Run the canonical verification command
        run: ./mvnw --batch-mode --no-transfer-progress verify
